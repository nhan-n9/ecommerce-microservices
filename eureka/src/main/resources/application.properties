# use the exact name in the configuration service
spring.application.name=registry-server

# define location want to fetch configuration
spring.config.import=optional:configserver:http://localhost:8888

# default eureka port
server.port=8761
eureka.instance.hostname=localhost

# disable fetching registry info from others
eureka.client.fetch-registry=false
# don't want the registry server to register with itself
eureka.client.register-with-eureka=false

# set the service url for eureka clients to register
eureka.client.service-url.default-zone=http://${eureka.instance.hostname}:${server.port}/eureka