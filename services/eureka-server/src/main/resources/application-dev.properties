spring.application.name=registry-server

spring.config.import=optional:configserver:http://config-server:8080
eureka.instance.hostname=registry-server

# default eureka port
server.port=8761

# disable fetching registry info from others
eureka.client.fetch-registry=false
# don't want the registry server to register with itself
eureka.client.register-with-eureka=false

# set the service url for eureka clients to register
eureka.client.service-url.default-zone=http://${eureka.instance.hostname}:${server.port}/eureka