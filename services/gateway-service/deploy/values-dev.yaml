nameOverride: ""
fullnameOverride: ""
podAnnotations: {}

image:
  repository: heheh123/ecomm-gateway
  pullPolicy: IfNotPresent
  tag: dev

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: public
  hosts:
    - paths:
        - path: /
          pathType: Prefix

configMap:
  enabled: true
  data:
    SPRING_PROFILES_ACTIVE: dev