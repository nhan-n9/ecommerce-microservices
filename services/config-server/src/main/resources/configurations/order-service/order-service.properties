server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5434/order_db
spring.datasource.username=hehe
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

application.config.user-url=http://localhost:8082/api/v1/users
application.config.product-url=http://localhost:8083/api/v1/products
application.config.payment-url=http://localhost:8084/api/v1/payments

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-description="Initial Baseline"
spring.flyway.baseline-version=0
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}

# Kafka server address
spring.kafka.bootstrap-servers=localhost:9092
# configure key & value serializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
#spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# pass in "orderConf" as object & provide full package where "orderConf" present
spring.kafka.producer.properties.spring.json.type.mapping=orderConfirmation:com.ecmicro.ecommerce.dto.KafkaOrderConfirmation