# spring.cloud.gateway.discovery.locator.enabled=false
# Discovery locator change

management.endpoints.web.exposure.include=health,info,prometheus

spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

spring.cloud.gateway.server.webflux.routes[0].id=identity-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://ecomm-identity-dev-ecomm-app
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/identity/**


spring.cloud.gateway.server.webflux.routes[1].id=product-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://ecomm-product-dev-ecomm-app
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/product-service/api/v1/products/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[1].filters[1]=AuthFilter


spring.cloud.gateway.server.webflux.routes[2].id=user-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://ecomm-user-dev-ecomm-app
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/user-service/api/v1/users/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[2].filters[1]=AuthFilter

spring.cloud.gateway.server.webflux.routes[3].id=order-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://ecomm-order-dev-ecomm-app
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/order-service/api/v1/orders/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[3].filters[1]=AuthFilter


spring.cloud.gateway.server.webflux.routes[4].id=payment-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://ecomm-payment-dev-ecomm-app
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/payment-service/api/v1/payments/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[4].filters[1]=AuthFilter