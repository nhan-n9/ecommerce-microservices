server.port=8085

spring.mongodb.username=hehe
spring.mongodb.password=123
spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=notification_db
spring.mongodb.authentication-database=admin

# Kafka config
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=paymentGroup,orderGroup
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.ecmicro.ecommerce.*
spring.kafka.consumer.properties.spring.json.type.mapping=orderConfirmation:com.ecmicro.ecommerce.dto.KafkaOrderConfirmation,paymentNotification:com.ecmicro.ecommerce.dto.KafkaPaymentNotification

# mail service config
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=hehe
spring.mail.password=123
spring.mail.properties.mail.smtp.trust='*'
spring.mail.properties.mail.auth=true
spring.mail.properties.mail.starttls.enabled=true
spring.mail.properties.mail.connectiontimeout=5000
spring.mail.properties.mail.writetimeout=5000
spring.mail.properties.mail.timeout=3000